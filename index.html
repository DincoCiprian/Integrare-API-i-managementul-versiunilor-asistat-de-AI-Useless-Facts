<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useless Facts Generator</title>

    <!-- Conectare fișier CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section class="app-container">

            <header>
                <h1>Useless Facts Generator</h1>
            </header>

            <section class="fact-section">
                <div id="fact-card">
                    <p id="fact-text">
                        Apasă butonul pentru a genera un fact inutil 🤓
                    </p>
                </div>
            </section>

            <section class="controls">
                <button id="generate-fact-btn">
                    Generează un fact inutil
                </button>
            </section>

            <section class="errors">
                <p id="error-message" hidden>
                    A apărut o eroare. Te rugăm să încerci din nou.
                </p>
            </section>

            <section class="previous-fact-section">
    <h2>Ultimul fact inutil</h2>
    <div id="previous-fact-card">
        <p id="previous-fact-text">
            Niciun fact generat încă.
        </p>
    </div>
</section>

            <footer>
                <p id="datetime">Data și timp: </p>
            </footer>

        </section>
    </main>

    <!-- Conectare fișier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
